# One command demo:  docker compose up --build   →  http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: handover
      POSTGRES_USER: handover
      POSTGRES_PASSWORD: handover
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handover"]
      interval: 5s
      retries: 10

  agent:
    build: ./agent
    env_file:
      - path: ./agent/.env
        required: false
    environment:
      CHECKPOINT_DB: /data/handover_checkpoints.sqlite
    volumes: [agentdata:/data]
    ports: ["8000:8000"]

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      agent: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/handover
      DB_USER: handover
      DB_PASSWORD: handover
      AGENT_URL: http://agent:8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      MEDIA_DIR: /data/media
    volumes: [media:/data/media]
    ports: ["8080:8080"]

  ui:
    build: ./ui
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  media:
  pgdata:
  agentdata:
